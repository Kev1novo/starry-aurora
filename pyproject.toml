[project]
name = "starry-aurora"
version = "0.1.0"
description = "智数归因平台 - 企业级 NL2SQL 与电商全链路归因系统"
requires-python = ">=3.12"
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: starry_aurora
    ports: ["3306:3306"]
    volumes: [mysql_dev:/var/lib/mysql]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_dev:/data]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_dev:/qdrant/storage]

  elasticsearch:
    image: elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [es_dev:/usr/share/elasticsearch/data]

volumes:
  mysql_dev:
  redis_dev:
  qdrant_dev:
  es_dev: